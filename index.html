<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый дашборд</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
</head>
<body>
    <div class="header-buttons">
        <a href="https://kseni-lerma.github.io/chat_bot_dash" class="back-button">
            <i class="fas fa-arrow-left"></i>
            <span class="back-text">Назад</span>
        </a>
        <div class="sidebar-toggle">
            <i class="fas fa-bars"></i>
            <span>Меню</span>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-chart-pie"></i> Разделы</h2>
        </div>
        <ul class="sidebar-menu"></ul>
        <div class="qr-code-container">
            <img src="qqr.png" alt="QR код">
        </div>
    </aside>

    <div class="container">
        <div class="section-header">
            <h1 id="current-section">Ипотека > Масштаб рынка</h1>
        </div>
        <div id="dashboard-container"></div>
        <div class="footer">
            <p>Источник: <strong>cbr.ru</strong></p>
        </div>
    </div>

    <!-- Детализация показателя -->
    <div id="detail-view" class="detail-view hidden">
        <div class="detail-header">
            <button id="back-btn" class="back-btn">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
            <div class="detail-header-content">
                <h2 id="detail-title"></h2>
                <div id="detail-comment" class="detail-comment"></div>
            </div>
        </div>

        <div class="detail-content">
            <div class="date-range-info">
                <span id="date-range-text"></span>
            </div>
            <div class="date-filters">
                <div class="date-filter">
                    <label for="start-date"><i class="far fa-calendar-alt"></i> Начало:</label>
                    <input type="date" id="start-date" class="date-input">
                </div>
                <div class="date-filter">
                    <label for="end-date"><i class="far fa-calendar-alt"></i> Конец:</label>
                    <input type="date" id="end-date" class="date-input">
                </div>
            </div>
            <div class="chart-container">
                <canvas id="detail-chart"></canvas>
            </div>
            <div id="pre-2025-table-container" class="table-container hidden"></div>
            <div class="chart-container hidden" id="premium-chart-container">
                <canvas id="premium-chart"></canvas>
            </div>
            <div id="post-2025-table-container" class="table-container hidden"></div>
        </div>
    </div>

    <script>Telegram.WebApp.expand(); Telegram.WebApp.enableClosingConfirmation();</script>
    <script src="script.js"></script>
</body>
</html>
